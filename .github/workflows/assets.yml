name: assets

# The Alpine component is compiled and committed so consumers don't have to
# build it. This guards the dist file against drifting from its source, and runs
# the JavaScript half of the parser-parity suite.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Alpine component mirrors src/Support/TimeParser.php. Both suites run
      # tests/Fixtures/parse-cases.json, so a rule changed on one side only
      # fails here or in the PHP job.
      - name: Run JavaScript tests
        run: npm test

      - name: Rebuild assets
        run: npm run build

      - name: Fail if dist is stale
        run: |
          if ! git diff --quiet -- resources/js/dist; then
            echo "::error::resources/js/dist is out of date. Run 'npm run build' and commit the result."
            git diff --stat -- resources/js/dist
            exit 1
          fi
